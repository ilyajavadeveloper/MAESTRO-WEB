<!DOCTYPE html>
<html lang="ru" dir="ltr" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- 1. Основные SEO-метаданные -->
    <title>MAESTRO Web Craft — Разработка сайтов и визуальных решений для бизнеса</title>
    <meta
            name="description"
            content="Студия цифровых решений MAESTRO Web Craft: разработка современных сайтов, конверсионных лендингов, веб-сервисов и фирменного стиля под ключ для роста вашего бизнеса."
    />
    <meta name="keywords" content="создание сайтов, веб-студия, разработка лендингов, UI/UX дизайн, веб-разработка, брендинг, MAESTRO" />
    <meta name="author" content="MAESTRO Web Craft" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- 2. Цвета интерфейса и темы браузера -->
    <meta name="theme-color" content="#0d0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAESTRO" />

    <!-- 3. Иконки и фавиконы (поддержка Retina, мобильных и десктопа) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 4. Open Graph (для превью ссылок в Telegram, VK, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="MAESTRO Web Craft" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="MAESTRO Web Craft — Разработка сайтов и визуальных решений" />
    <meta
            property="og:description"
            content="Создаем премиальные сайты, лендинги и digital-продукты, которые выделяют ваш бизнес среди конкурентов и привлекают клиентов."
    />
    <!-- Размер изображения для превью: 1200x630 px -->
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAESTRO Web Craft — Digital Studio" />

    <!-- 5. Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAESTRO Web Craft — Разработка сайтов для бизнеса" />
    <meta
            name="twitter:description"
            content="Создание лендингов, сайтов и визуальных решений для бизнеса под ключ."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />

    <!-- 6. Предзагрузка критических ресурсов (Preconnect / DNS-prefetch) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://acsbapp.com" />

    <!-- 7. Микроразметка Schema.org (JSON-LD) — дает красивый сниппет компании в Google и Яндексе -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "ProfessionalService",
            "name": "MAESTRO Web Craft",
            "alternateName": "MAESTRO STUDIO",
            "url": "https://yourdomain.com",
            "logo": "https://yourdomain.com/logo.png",
            "image": "https://yourdomain.com/og-image.jpg",
            "description": "Разработка сайтов, конверсионных лендингов и визуальных digital-решений для бизнеса.",
            "telephone": "+7 (999) 000-00-00",
            "email": "contact@yourdomain.com",
            "priceRange": "$$",
            "address": {
                "@type": "PostalAddress",
                "addressCountry": "RU",
                "addressLocality": "Москва"
            },
            "sameAs": [
                "https://t.me/your_telegram_channel",
                "https://vk.com/your_vk_group"
            ]
        }
    </script>

    <!-- 8. Виджет доступности UserWay (асинхронная безопасная загрузка) -->
    <script>
        (function (d) {
            var s = d.createElement("script");
            /* Замените xxxxxxxx на ваш реальный ID аккаунта UserWay */
            s.setAttribute("data-account", "xxxxxxxx");
            s.setAttribute("src", "https://acsbapp.com/apps/app.js");
            s.setAttribute("async", "");
            (d.head || d.body).appendChild(s);
        })(document);
    </script>
</head>

<body>
<!-- Сообщение для поисковых ботов и пользователей с выключенным JS -->
<noscript>
    <div style="padding: 20px; text-align: center; font-family: sans-serif; background-color: #111; color: #fff;">
        <h2>MAESTRO Web Craft</h2>
        <p>Для полноценной работы интерактивных функций сайта требуется включенный JavaScript в вашем браузере.</p>
        <p>Вы можете связаться с нами напрямую: <a href="mailto:contact@yourdomain.com" style="color: #4da6ff;">contact@yourdomain.com</a></p>
    </div>
</noscript>

<!-- Точка монтирования React-приложения -->
<div id="root"></div>

<!-- Входной файл сборщика Vite -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
